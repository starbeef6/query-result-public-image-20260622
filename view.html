<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>查询结果</title>
  <style>
    :root {
      color-scheme: light;
    }

    html, body {
      margin: 0;
      background: #f3f6fb;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0;
    }

    .frame {
      width: min(100vw, 820px);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: #ffffff;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main class="frame">
    <img src="./query-result.jpg" alt="查询结果">
  </main>
</body>
</html>
